# Каждый push и PR: clippy, тесты и сборки в артефактах: exe для Windows, .deb, .rpm и
# AppImage для Linux (x86_64 и aarch64), APK для Android, IPA для iOS (без подписи). Тег v* (например v1.0.1): то же
# и релиз со всеми файлами. Его создаёт отдельное задание после всех сборок. Встроенная
# обновлялка на Windows ищет в релизе yamusic-rs.exe, на Android — APK.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      # Без zip: из артефактов скачивается сразу yamusic-rs.exe.
      - uses: actions/upload-artifact@v7
        with:
          name: yamusic-rs-exe
          path: target/release/yamusic-rs.exe
          archive: false

  # Ubuntu 22.04 — самая старая glibc (2.35) среди поддерживаемых: собранное здесь
  # запускается и на ней, и на всех более новых дистрибутивах.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Зависимости сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: Пакеты
        id: pkg
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
          tools/appimage.sh
          cargo deb --no-build
          cargo generate-rpm
          echo "deb=$(ls target/debian/*.deb)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(ls target/generate-rpm/*.rpm)" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        run: sha256sum target/release/yamusic-rs target/appimage/*.AppImage ${{ steps.pkg.outputs.deb }} ${{ steps.pkg.outputs.rpm }}

      # По файлу на артефакт: без zip каждый скачивается как есть.
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: target/appimage/yamusic-rs-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: deb-x86_64
          path: ${{ steps.pkg.outputs.deb }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-x86_64
          path: ${{ steps.pkg.outputs.rpm }}
          archive: false

  # Нативный ARM-раннер на той же Ubuntu 22.04 (glibc 2.35), без qemu и кросс-тулчейна.
  # Clippy и тесты уже прошли на x86_64, здесь только сборка и пакеты.
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Зависимости сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype-dev             libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev             libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Пакеты
        id: pkg
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
          tools/appimage.sh
          cargo deb --no-build
          cargo generate-rpm
          echo "deb=$(ls target/debian/*.deb)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(ls target/generate-rpm/*.rpm)" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        run: sha256sum target/release/yamusic-rs target/appimage/*.AppImage ${{ steps.pkg.outputs.deb }} ${{ steps.pkg.outputs.rpm }}

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-aarch64
          path: target/appimage/yamusic-rs-aarch64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: deb-arm64
          path: ${{ steps.pkg.outputs.deb }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-aarch64
          path: ${{ steps.pkg.outputs.rpm }}
          archive: false

  # APK для телефонов (arm64-v8a, Android 8+). Ключ выпуска лежит в секретах репозитория,
  # без него по тегу сборка падает: APK с другой подписью не встанет поверх уже установленного.
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Ключ выпуска есть
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android -> target

      # Версия — как NDK_VERSION в tools/apk.sh.
      - name: NDK r30
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" > /dev/null

      - name: APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: tools/apk.sh

      - name: SHA-256
        run: sha256sum target/apk/yamusic-rs-arm64-v8a.apk

      - uses: actions/upload-artifact@v7
        with:
          name: apk-arm64-v8a
          path: target/apk/yamusic-rs-arm64-v8a.apk
          archive: false

  # IPA для iPhone (iOS 15+), пока без подписи и вне релиза: ставится через Sideloadly
  # или AltStore, они подписывают файл Apple ID пользователя.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios -> target

      - name: IPA
        run: ios/build.sh

      - name: SHA-256
        run: shasum -a 256 ios/target/ios/yamusic-rs.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: ios/target/ios/yamusic-rs.ipa
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, linux-arm64, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # В «What's Changed» GitHub кладёт только PR: свои коммиты дописываем туда же.
      - name: Заметки релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prev=$(gh release view --json tagName --jq .tagName)
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" --jq .body > notes.md
          # Свои коммиты, без PR: заголовок «… (#N)» ставит squash-слияние PR, «X.Y.Z» — коммит версии.
          gh api "repos/$GH_REPO/compare/$prev...$GITHUB_REF_NAME" --paginate --jq '.commits[]
            | (.commit.message | split("\n")[0]) as $t
            | select(($t | test("\\(#[0-9]+\\)")) or ($t | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | not)
            | "* \($t) by @\(.author.login // .commit.author.name) in \(.html_url)"' > own.md
          python3 - <<'EOF'
          notes = open('notes.md', encoding='utf8').read()
          own = open('own.md', encoding='utf8').read().strip()
          head = "## What's Changed\n"
          if own:
              if head in notes:
                  i = notes.index(head) + len(head)
                  j = notes.find('\n\n', i)
                  j = len(notes) if j < 0 else j
                  notes = notes[:j] + '\n' + own + notes[j:]
              else:
                  notes = head + own + '\n\n' + notes
          open('notes.md', 'w', encoding='utf8').write(notes)
          EOF

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --notes-file notes.md
